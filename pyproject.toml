[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ano-reference-runtime"
version = "0.5.0a4"
description = "Minimal reference runtime and conformance tools for the ANO Specification"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=46,<52",
  "jsonschema>=4.23,<5",
]

[tool.setuptools]
package-dir = {"" = "reference/python"}

[tool.setuptools.packages.find]
where = ["reference/python"]
